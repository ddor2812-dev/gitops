apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  RESPONSE_TEXT: "Hello from Backend API"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: hashicorp/http-echo:0.2.3
        args:
        - "-text=$(RESPONSE_TEXT)"
        envFrom:
        - configMapRef:
            name: backend-config
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 5678
