apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/message {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GitOps App-of-Apps Demo</title>
        <!-- Import Google Font Outfit -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-primary: #0b0f19;
                --bg-secondary: rgba(23, 32, 53, 0.65);
                --border-color: rgba(255, 255, 255, 0.08);
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --accent-blue: #3b82f6;
                --accent-purple: #8b5cf6;
                --success: #10b981;
                --error: #f43f5e;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: var(--bg-primary);
                background-image: 
                    radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
                color: var(--text-primary);
                font-family: 'Outfit', sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 24px;
            }

            .container {
                width: 100%;
                max-width: 600px;
                perspective: 1000px;
            }

            .card {
                background: var(--bg-secondary);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid var(--border-color);
                border-radius: 24px;
                padding: 40px;
                box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
                text-align: center;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }

            .card:hover {
                transform: translateY(-5px);
                box-shadow: 0 30px 50px -10px rgba(59, 130, 246, 0.15);
            }

            .badge-container {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-bottom: 24px;
            }

            .badge {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid var(--border-color);
                padding: 6px 14px;
                border-radius: 99px;
                font-size: 0.75rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: var(--text-secondary);
            }

            .badge.argocd {
                color: #ff543e;
                background: rgba(255, 84, 62, 0.1);
                border-color: rgba(255, 84, 62, 0.2);
            }

            .badge.k8s {
                color: #326ce5;
                background: rgba(50, 108, 229, 0.1);
                border-color: rgba(50, 108, 229, 0.2);
            }

            h1 {
                font-size: 2.5rem;
                font-weight: 800;
                line-height: 1.2;
                margin-bottom: 12px;
                background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .subtitle {
                color: var(--text-secondary);
                font-size: 1.05rem;
                line-height: 1.6;
                margin-bottom: 32px;
                font-weight: 300;
            }

            .status-section {
                background: rgba(0, 0, 0, 0.2);
                border: 1px solid var(--border-color);
                border-radius: 16px;
                padding: 24px;
                margin-bottom: 32px;
                text-align: left;
            }

            .status-title {
                font-size: 0.8rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                color: var(--text-secondary);
                margin-bottom: 12px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background-color: var(--text-secondary);
                display: inline-block;
            }

            .status-dot.active {
                background-color: var(--success);
                box-shadow: 0 0 12px var(--success);
                animation: pulse 2s infinite;
            }

            .status-dot.error {
                background-color: var(--error);
                box-shadow: 0 0 12px var(--error);
            }

            @keyframes pulse {
                0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
                70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
                100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
            }

            .response-box {
                font-family: 'Courier New', Courier, monospace;
                background: rgba(15, 23, 42, 0.8);
                border-radius: 8px;
                padding: 14px;
                color: #38bdf8;
                font-size: 0.9rem;
                min-height: 50px;
                display: flex;
                align-items: center;
                word-break: break-all;
                border-left: 3px solid var(--accent-blue);
            }

            .btn-call {
                background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
                color: white;
                border: none;
                padding: 16px 32px;
                font-size: 1rem;
                font-weight: 600;
                border-radius: 12px;
                cursor: pointer;
                width: 100%;
                transition: all 0.3s ease;
                box-shadow: 0 8px 16px -4px rgba(59, 130, 246, 0.3);
            }

            .btn-call:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 20px -2px rgba(59, 130, 246, 0.4);
                filter: brightness(1.1);
            }

            .btn-call:active {
                transform: translateY(0);
            }

            footer {
                margin-top: 32px;
                font-size: 0.8rem;
                color: var(--text-secondary);
                opacity: 0.6;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="card">
                <div class="badge-container">
                    <span class="badge argocd">Argo CD App-of-Apps</span>
                    <span class="badge k8s">Kubernetes</span>
                </div>
                <h1>GitOps Workspace</h1>
                <p class="subtitle">Trải nghiệm kiến trúc App-of-Apps đồng bộ qua Argo CD</p>

                <div class="status-section">
                    <div class="status-title">
                        <span class="status-dot" id="status-indicator"></span>
                        <span>Backend Connection Status</span>
                    </div>
                    <div class="response-box" id="response-content">
                        Đang kết nối đến Backend...
                    </div>
                </div>

                <button class="btn-call" onclick="fetchBackend()">Gửi yêu cầu tới Backend API</button>
            </div>
        </div>
        <footer>
            Cung cấp bởi Kubernetes & Argo CD Automation
        </footer>

        <script>
            async function fetchBackend() {
                const indicator = document.getElementById('status-indicator');
                const responseBox = document.getElementById('response-content');
                
                indicator.className = 'status-dot';
                responseBox.innerText = 'Đang gọi Backend API...';
                
                try {
                    const res = await fetch('/api/message');
                    if (res.ok) {
                        const text = await res.text();
                        indicator.className = 'status-dot active';
                        responseBox.style.color = '#34d399';
                        responseBox.innerText = text.trim();
                    } else {
                        throw new Error('Mã lỗi: ' + res.status);
                    }
                } catch (err) {
                    indicator.className = 'status-dot error';
                    responseBox.style.color = '#f87171';
                    responseBox.innerText = 'Không thể kết nối Backend.\nLý do: ' + err.message + '\n\n*Lưu ý: Bạn cần truy cập qua Port-forward của frontend và kết nối backend trong cụm k8s phải hoạt động.';
                }
            }
            
            fetchBackend();
        </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.27
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: config-volume
        configMap:
          name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
