apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/message {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GitOps App-of-Apps Demo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-primary: #0b0f19;
                --bg-card: rgba(23, 32, 53, 0.65);
                --border: rgba(255, 255, 255, 0.08);
                --text-1: #f8fafc;
                --text-2: #94a3b8;
                --blue: #3b82f6;
                --purple: #8b5cf6;
                --green: #10b981;
                --red: #f43f5e;
                --orange: #f59e0b;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                background: var(--bg-primary);
                background-image:
                    radial-gradient(at 0% 0%, rgba(59,130,246,0.12) 0, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(139,92,246,0.12) 0, transparent 50%);
                color: var(--text-1);
                font-family: 'Outfit', sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 20px;
                gap: 20px;
            }

            /* ── Header ── */
            .header { text-align: center; margin-bottom: 4px; }
            .badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
            .badge {
                padding: 5px 12px; border-radius: 99px; font-size: 0.7rem;
                font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
                border: 1px solid var(--border);
            }
            .badge.argo { color: #ff543e; background: rgba(255,84,62,0.1); border-color: rgba(255,84,62,0.2); }
            .badge.k8s  { color: #326ce5; background: rgba(50,108,229,0.1); border-color: rgba(50,108,229,0.2); }
            h1 {
                font-size: 2rem; font-weight: 800;
                background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
                -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            }
            .sub { color: var(--text-2); font-size: 0.95rem; margin-top: 6px; font-weight: 300; }

            /* ── Architecture Diagram ── */
            .arch {
                display: flex; align-items: center; justify-content: center;
                gap: 0; width: 100%; max-width: 700px;
            }
            .node {
                background: var(--bg-card); backdrop-filter: blur(10px);
                border: 1px solid var(--border); border-radius: 16px;
                padding: 20px 16px; text-align: center; flex: 1;
                min-width: 0; transition: all 0.4s ease;
                position: relative;
            }
            .node.active { border-color: var(--blue); box-shadow: 0 0 20px rgba(59,130,246,0.2); }
            .node.success { border-color: var(--green); box-shadow: 0 0 20px rgba(16,185,129,0.2); }
            .node.error { border-color: var(--red); box-shadow: 0 0 20px rgba(244,63,94,0.2); }
            .node-icon { font-size: 2rem; margin-bottom: 8px; }
            .node-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
            .node-desc { color: var(--text-2); font-size: 0.7rem; line-height: 1.4; }
            .node-status {
                margin-top: 10px; padding: 4px 10px; border-radius: 8px;
                font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
                letter-spacing: 0.5px; display: inline-block;
            }
            .status-idle    { background: rgba(148,163,184,0.15); color: var(--text-2); }
            .status-sending { background: rgba(59,130,246,0.15); color: var(--blue); }
            .status-ok      { background: rgba(16,185,129,0.15); color: var(--green); }
            .status-err     { background: rgba(244,63,94,0.15); color: var(--red); }

            /* ── Arrows ── */
            .arrow {
                display: flex; flex-direction: column; align-items: center;
                gap: 2px; padding: 0 6px; min-width: 50px; position: relative;
            }
            .arrow-line {
                width: 100%; height: 2px; background: var(--border);
                position: relative; border-radius: 2px; overflow: hidden;
            }
            .arrow-line .pulse {
                position: absolute; top: 0; left: -30%; width: 30%; height: 100%;
                border-radius: 2px; opacity: 0;
            }
            .arrow-label {
                font-size: 0.55rem; color: var(--text-2); text-transform: uppercase;
                letter-spacing: 1px; white-space: nowrap;
            }

            /* Animations */
            @keyframes sendRight {
                0%   { left: -30%; opacity: 0; }
                20%  { opacity: 1; }
                80%  { opacity: 1; }
                100% { left: 100%; opacity: 0; }
            }
            @keyframes sendLeft {
                0%   { right: -30%; opacity: 0; }
                20%  { opacity: 1; }
                80%  { opacity: 1; }
                100% { right: 100%; opacity: 0; }
            }
            .arrow-line .pulse.go {
                background: linear-gradient(90deg, transparent, var(--blue), transparent);
                animation: sendRight 0.8s ease-in-out forwards;
            }
            .arrow-line .pulse.back {
                background: linear-gradient(90deg, transparent, var(--green), transparent);
                animation: sendLeft 0.8s ease-in-out forwards;
                left: auto;
            }
            .arrow-line .pulse.back-err {
                background: linear-gradient(90deg, transparent, var(--red), transparent);
                animation: sendLeft 0.8s ease-in-out forwards;
                left: auto;
            }

            /* ── Response Card ── */
            .response-card {
                background: var(--bg-card); backdrop-filter: blur(10px);
                border: 1px solid var(--border); border-radius: 16px;
                padding: 24px; width: 100%; max-width: 700px;
                transition: border-color 0.4s ease;
            }
            .response-card.success { border-color: rgba(16,185,129,0.3); }
            .response-card.error   { border-color: rgba(244,63,94,0.3); }
            .response-header {
                display: flex; justify-content: space-between; align-items: center;
                margin-bottom: 12px;
            }
            .response-label { font-size: 0.75rem; font-weight: 600; color: var(--text-2);
                text-transform: uppercase; letter-spacing: 1px; }
            .response-time { font-size: 0.7rem; color: var(--text-2); font-family: monospace; }
            .response-body {
                background: rgba(15,23,42,0.8); border-radius: 10px; padding: 16px;
                font-family: 'Courier New', monospace; font-size: 0.85rem;
                color: var(--text-2); min-height: 48px; display: flex;
                align-items: center; border-left: 3px solid var(--border);
                transition: all 0.4s ease; line-height: 1.6;
                white-space: pre-wrap;
            }
            .response-body.ok   { color: #34d399; border-left-color: var(--green); }
            .response-body.err  { color: #f87171; border-left-color: var(--red); }
            .response-body.wait { color: var(--text-2); border-left-color: var(--border); }

            /* ── Button ── */
            .btn {
                background: linear-gradient(135deg, var(--blue), var(--purple));
                color: #fff; border: none; padding: 16px 28px;
                font-size: 1rem; font-weight: 600; border-radius: 14px;
                cursor: pointer; width: 100%; max-width: 700px;
                transition: all 0.3s ease;
                box-shadow: 0 8px 20px -4px rgba(59,130,246,0.35);
                display: flex; align-items: center; justify-content: center; gap: 10px;
            }
            .btn:hover { transform: translateY(-2px); filter: brightness(1.1);
                box-shadow: 0 12px 24px -4px rgba(59,130,246,0.4); }
            .btn:active { transform: translateY(0); }
            .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
            .btn-icon { font-size: 1.2rem; }

            /* ── Request counter ── */
            .counter {
                font-size: 0.75rem; color: var(--text-2); text-align: center;
                margin-top: -4px;
            }
            .counter span { color: var(--blue); font-weight: 600; }

            /* ── Spinner ── */
            @keyframes spin { to { transform: rotate(360deg); } }
            .spinner {
                width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
                border-top-color: #fff; border-radius: 50%;
                animation: spin 0.6s linear infinite; display: none;
            }
            .btn.loading .spinner { display: block; }
            .btn.loading .btn-label { display: none; }

            footer { font-size: 0.75rem; color: var(--text-2); opacity: 0.5; margin-top: 8px; }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="badges">
                <span class="badge argo">Argo CD</span>
                <span class="badge k8s">Kubernetes</span>
            </div>
            <h1>GitOps Workspace</h1>
            <p class="sub">Trực quan hóa luồng giao tiếp Frontend ↔ Backend trong cụm K8s</p>
        </div>

        <!-- Architecture Diagram -->
        <div class="arch">
            <div class="node" id="n-browser">
                <div class="node-icon">🖥️</div>
                <div class="node-title">Browser</div>
                <div class="node-desc">Trình duyệt<br>của bạn</div>
                <div class="node-status status-idle" id="s-browser">Chờ thao tác</div>
            </div>

            <div class="arrow" id="a1">
                <div class="arrow-label">Request</div>
                <div class="arrow-line"><div class="pulse" id="p1"></div></div>
                <div class="arrow-label">Response</div>
                <div class="arrow-line"><div class="pulse" id="p1b"></div></div>
            </div>

            <div class="node" id="n-nginx">
                <div class="node-icon">⚙️</div>
                <div class="node-title">Nginx Proxy</div>
                <div class="node-desc">Frontend Pod<br>/api → Backend</div>
                <div class="node-status status-idle" id="s-nginx">Idle</div>
            </div>

            <div class="arrow" id="a2">
                <div class="arrow-label">Proxy</div>
                <div class="arrow-line"><div class="pulse" id="p2"></div></div>
                <div class="arrow-label">Response</div>
                <div class="arrow-line"><div class="pulse" id="p2b"></div></div>
            </div>

            <div class="node" id="n-backend">
                <div class="node-icon">🗄️</div>
                <div class="node-title">Backend API</div>
                <div class="node-desc">http-echo Pod<br>port 8080</div>
                <div class="node-status status-idle" id="s-backend">Idle</div>
            </div>
        </div>

        <!-- Response Card -->
        <div class="response-card" id="res-card">
            <div class="response-header">
                <span class="response-label">📨 Kết quả phản hồi</span>
                <span class="response-time" id="res-time"></span>
            </div>
            <div class="response-body wait" id="res-body">Chưa có yêu cầu nào được gửi.
    Nhấn nút bên dưới để bắt đầu.</div>
        </div>

        <!-- Button -->
        <button class="btn" id="send-btn" onclick="sendRequest()">
            <span class="btn-icon">🚀</span>
            <span class="btn-label">Gửi yêu cầu tới Backend API</span>
            <div class="spinner"></div>
        </button>
        <div class="counter">Số lần gọi: <span id="count">0</span></div>

        <footer>Cung cấp bởi Kubernetes &amp; Argo CD Automation</footer>

        <script>
            let requestCount = 0;

            function setStatus(id, cls, text) {
                const el = document.getElementById(id);
                el.className = 'node-status ' + cls;
                el.textContent = text;
            }
            function setNode(id, cls) {
                const el = document.getElementById(id);
                el.className = 'node ' + cls;
            }
            function resetNodes() {
                ['n-browser','n-nginx','n-backend'].forEach(n => setNode(n, ''));
                setStatus('s-browser', 'status-idle', 'Chờ thao tác');
                setStatus('s-nginx', 'status-idle', 'Idle');
                setStatus('s-backend', 'status-idle', 'Idle');
            }
            function animatePulse(id, cls) {
                const el = document.getElementById(id);
                el.className = 'pulse';
                void el.offsetWidth; // force reflow
                el.className = 'pulse ' + cls;
            }

            function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

            async function sendRequest() {
                const btn = document.getElementById('send-btn');
                const resBody = document.getElementById('res-body');
                const resCard = document.getElementById('res-card');
                const resTime = document.getElementById('res-time');
                btn.disabled = true;
                btn.classList.add('loading');

                // Reset
                resetNodes();
                resCard.className = 'response-card';
                resBody.className = 'response-body wait';
                resBody.textContent = 'Đang xử lý...';
                resTime.textContent = '';

                const t0 = performance.now();

                // Step 1: Browser sends request
                setNode('n-browser', 'active');
                setStatus('s-browser', 'status-sending', 'Đang gửi...');
                animatePulse('p1', 'go');
                await delay(800);

                // Step 2: Nginx receives and proxies
                setNode('n-nginx', 'active');
                setStatus('s-nginx', 'status-sending', 'Proxy pass...');
                animatePulse('p2', 'go');
                await delay(600);

                // Step 3: Backend processes
                setNode('n-backend', 'active');
                setStatus('s-backend', 'status-sending', 'Xử lý...');

                try {
                    const res = await fetch('/api/message');
                    const elapsed = Math.round(performance.now() - t0);

                    if (res.ok) {
                        const text = await res.text();

                        // Backend responds OK
                        setNode('n-backend', 'success');
                        setStatus('s-backend', 'status-ok', '200 OK');
                        await delay(300);

                        // Response travels back
                        animatePulse('p2b', 'back');
                        await delay(600);
                        setNode('n-nginx', 'success');
                        setStatus('s-nginx', 'status-ok', 'Nhận phản hồi');
                        animatePulse('p1b', 'back');
                        await delay(600);

                        // Browser receives
                        setNode('n-browser', 'success');
                        setStatus('s-browser', 'status-ok', 'Thành công');

                        resBody.className = 'response-body ok';
                        resBody.textContent = '✅ ' + text.trim();
                        resCard.className = 'response-card success';
                        resTime.textContent = elapsed + 'ms';
                    } else {
                        throw new Error('HTTP ' + res.status);
                    }
                } catch (err) {
                    const elapsed = Math.round(performance.now() - t0);

                    setNode('n-backend', 'error');
                    setStatus('s-backend', 'status-err', 'Lỗi');
                    await delay(300);
                    animatePulse('p2b', 'back-err');
                    await delay(600);
                    setNode('n-nginx', 'error');
                    setStatus('s-nginx', 'status-err', 'Lỗi proxy');
                    animatePulse('p1b', 'back-err');
                    await delay(600);
                    setNode('n-browser', 'error');
                    setStatus('s-browser', 'status-err', 'Thất bại');

                    resBody.className = 'response-body err';
                    resBody.textContent = '❌ Không thể kết nối Backend\nLý do: ' + err.message;
                    resCard.className = 'response-card error';
                    resTime.textContent = elapsed + 'ms';
                }

                requestCount++;
                document.getElementById('count').textContent = requestCount;
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.27
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: config-volume
        configMap:
          name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
