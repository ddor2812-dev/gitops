apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/ddor2812-dev/gitops.git
    targetRevision: main
    path: argocd/apps        # Trỏ thẳng vào thư mục chứa các app con
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true